name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Устанавливаем системный Gradle (он не требует файла gradlew)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Собираем проект системным Gradle, а не через ./gradlew
    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: app/build/outputs/apk/debug/*.apk
